<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>ECOM - Customer Dashboard</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f7f7f7;
        }

        .navbar {
            height: 70px;
            background: white;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .logo {
            font-size: 28px;
            font-weight: bold;
            color: #00a82d;
        }

        .nav-links {
            display: flex;
            gap: 30px;
        }

        .nav-links a {
            text-decoration: none;
            color: #333;
            font-weight: 600;
        }

        .container {
            padding: 40px;
        }

        .welcome {
            margin-bottom: 30px;
        }

        .welcome h1 {
            font-size: 32px;
            margin-bottom: 8px;
        }

        .welcome p {
            color: #777;
        }

        .cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 25px;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 3px 15px rgba(0,0,0,0.08);
        }

        .card h2 {
            margin-bottom: 10px;
        }

        .card p {
            color: #777;
            margin-bottom: 20px;
        }

        .card button {
            border: none;
            background: #00a82d;
            color: white;
            padding: 10px 18px;
            border-radius: 5px;
            cursor: pointer;
        }

    </style>

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            ECOM
        </div>

        <div class="nav-links">

            <a href="/dashboard">Home</a>

            <a href="#">Products</a>

            <a href="#">Cart</a>

            <a href="#">Orders</a>

            <a href="/logout">Logout</a>

        </div>

    </nav>


    <div class="container">

        <div class="welcome">

            <h1>Welcome to ECOM 🛒</h1>

            <p>
                Everything you need, delivered to your doorstep.
            </p>

        </div>


        <div class="cards">

            <div class="card">

                <h2>🛍️ Products</h2>

                <p>
                    Browse all available products.
                </p>

                <button>
                    View Products
                </button>

            </div>


            <div class="card">

                <h2>🛒 My Cart</h2>

                <p>
                    View and manage your shopping cart.
                </p>

                <button>
                    View Cart
                </button>

            </div>


            <div class="card">

                <h2>📦 My Orders</h2>

                <p>
                    Track your previous and current orders.
                </p>

                <button>
                    View Orders
                </button>

            </div>

        </div>

    </div>

</body>

</html>
